services:

  postgres:
    image: postgres:16
    container_name: picip_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"


  python:
    image: python:3.12-slim
    container_name: picip_python
    restart: always
    working_dir: /app
    volumes:
      - ./backend:/app
    command:
      - python
      - -c
      - "print('PICIP Python Engine Ready')"
    depends_on:
      - postgres


  react:
    image: node:20
    container_name: picip_react
    restart: always
    working_dir: /app
    volumes:
      - ./frontend:/app
    command:
      - sh
      - -c
      - "echo PICIP React Dashboard Ready && tail -f /dev/null"
    ports:
      - "3000:3000"


  node:
    image: node:20
    container_name: picip_node
    restart: always
    working_dir: /app
    volumes:
      - ./notifications:/app
    command:
      - sh
      - -c
      - "echo PICIP Notification Service Ready && tail -f /dev/null"


volumes:

  postgres_data:
